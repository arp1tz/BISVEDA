# BISVEDA V8 — Model Registry Configuration (D40)
# Maps functional AI roles to ordered provider chains with strict fallbacks.

roles:
  reasoning:
    - hosted_primary
    - hosted_fallback
    - local_primary
    - evidence_only
  router:
    - hosted_fast
    - local_primary
    - rules_only
  vision:
    - hosted_vision
    - local_primary
    - none
  translate:
    - bhashini
    - hosted_primary
    - none

providers:
  hosted_primary:
    litellm_model: "${HOSTED_PRIMARY_MODEL:-groq/llama-3.3-70b-versatile}"
    timeout_s: 20
    api_key_env: "GROQ_API_KEY"
  hosted_fallback:
    litellm_model: "${HOSTED_FALLBACK_MODEL:-openai/gpt-4o-mini}"
    timeout_s: 20
    api_key_env: "OPENAI_API_KEY"
  hosted_fast:
    litellm_model: "${HOSTED_FAST_MODEL:-groq/llama-3.1-8b-instant}"
    timeout_s: 6
    api_key_env: "GROQ_API_KEY"
  hosted_vision:
    litellm_model: "${HOSTED_VISION_MODEL:-gemini/gemini-1.5-flash}"
    timeout_s: 20
    api_key_env: "GEMINI_API_KEY"
  local_primary:
    litellm_model: "ollama/${LOCAL_MODEL:-qwen2.5:7b}"
    api_base: "${OLLAMA_BASE_URL:-http://localhost:11434}"
    timeout_s: 60
  bhashini:
    api_base: "${BHASHINI_BASE_URL:-https://dhruva-api.bhashini.gov.in}"
    timeout_s: 10
  evidence_only:
    kind: "deterministic_synthesis"
  rules_only:
    kind: "regex_rules"

policy:
  retries_per_provider: 0
  cooldown_s: 60
  terminal_fallback: "evidence_only"
