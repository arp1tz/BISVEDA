# BISVEDA V8 — Feature Flags Configuration
# Controls runtime safety gates, tier enforcement, and fallback modes.

flags:
  generation_enabled: false  # When false, uses evidence-only deterministic synthesis (Rule 6)
  strict_tier_enforcement: true  # Enforces Rule 3 (no numeric values/quotes for Tier A)
  require_adjudication_before_gen: true  # Enforces Rule 2 (adjudicate before generation)
  quarantine_uploads: true  # Enforces Rule 9 (all user uploads quarantined)
  preserve_citation_markers: true  # Enforces Rule 4 & D39 ([S#] markers)
  relevance_floor: 0.45  # Calibrated relevance cutoff for regulated safety gate
  audit_logging: true  # Logs all stage transitions and trust violations
  bhashini_enabled: false  # Indic translation via Bhashini
  local_pin_centroids: true  # D42 local geocoding
