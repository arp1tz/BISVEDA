<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <filter id="pcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#0b1329" />
  <ellipse cx="400" cy="520" rx="260" ry="35" fill="#020617" opacity="0.8" />

  <!-- PRESSURE COOKER BODY -->
  <g transform="translate(10, 0)">
    <!-- Base Pot Body -->
    <path d="M 260 260 L 540 260 C 560 380 540 480 490 500 C 440 515 360 515 310 500 C 260 480 240 380 260 260 Z" fill="url(#metalGrad)" stroke="#475569" stroke-width="2" />
    
    <!-- Body Highlight -->
    <path d="M 330 265 C 320 350 330 460 360 495 C 340 460 335 350 345 265 Z" fill="#ffffff" opacity="0.45" />

    <!-- Cooker Main Long Handle (Bakelite) -->
    <path d="M 120 230 C 180 230 240 245 270 255 L 265 275 C 235 265 180 250 120 250 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <circle cx="140" cy="240" r="4" fill="#94a3b8" />

    <!-- Lid Long Handle -->
    <path d="M 120 210 C 180 210 240 225 270 235 L 265 255 C 235 245 180 230 120 230 Z" fill="#090d16" stroke="#1e293b" stroke-width="2" />
    <circle cx="140" cy="220" r="4" fill="#94a3b8" />

    <!-- Right Side Grip Handle -->
    <path d="M 535 255 C 570 245 615 250 635 270 C 625 285 580 280 545 270 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

    <!-- Domed Pressure Lid -->
    <path d="M 255 255 C 270 170 530 170 545 255 Z" fill="url(#lidGrad)" stroke="#475569" stroke-width="2" />
    <ellipse cx="400" cy="255" rx="145" ry="12" fill="#334155" opacity="0.6" />

    <!-- Center Vent Pipe & Safety Weight Valve (Whistle) -->
    <rect x="392" y="145" width="16" height="35" rx="2" fill="#64748b" stroke="#334155" stroke-width="1.5" />
    <path d="M 382 120 L 418 120 L 414 148 L 386 148 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="388" y="112" width="24" height="10" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1" />

    <!-- Safety Relief Valve (Fusible Plug) -->
    <circle cx="465" cy="205" r="9" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
    <circle cx="465" cy="205" r="4" fill="#dc2626" />

    <!-- ISI Mark Engraved on Cooker Body -->
    <g transform="translate(355, 340)">
      <rect x="0" y="0" width="90" height="70" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#pcGlow)" />
      <text x="45" y="11" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="900" fill="#0f172a" text-anchor="middle">IS 2347:2017</text>
      <line x1="8" y1="14" x2="82" y2="14" stroke="#0f172a" stroke-width="0.8" />
      
      <!-- ISI Emblem -->
      <g transform="translate(32, 17) scale(0.65)">
        <rect x="0" y="0" width="40" height="36" fill="none" stroke="#0f172a" stroke-width="2" rx="2" />
        <line x1="7" y1="6" x2="7" y2="30" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
        <path d="M 27 10 C 27 6 13 6 13 18 C 13 30 27 30 27 24" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
        <line x1="7" y1="18" x2="27" y2="18" stroke="#0f172a" stroke-width="2.5" />
      </g>

      <line x1="8" y1="44" x2="82" y2="44" stroke="#0f172a" stroke-width="0.8" />
      <text x="45" y="52" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="800" fill="#0f172a" text-anchor="middle">CM/L-7829104567</text>
      <text x="45" y="60" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="#475569" text-anchor="middle">DOMESTIC PRESSURE COOKER</text>
      <text x="45" y="66" font-family="'JetBrains Mono', monospace" font-size="4.5" font-weight="bold" fill="#0284c7" text-anchor="middle">5.0 LITRE | SS 304</text>
    </g>

    <!-- Pointer Callout -->
    <g transform="translate(350, 340)">
      <circle cx="0" cy="0" r="6" fill="#10b981" />
      <line x1="0" y1="0" x2="-40" y2="-40" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
      <rect x="-155" y="-62" width="120" height="24" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="-95" y="-46" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ecfdf5" text-anchor="middle">✓ Genuine Cooker ISI</text>
    </g>
  </g>

  <!-- HUD Overlay -->
  <g transform="translate(400, 45)">
    <rect x="-165" y="-15" width="330" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <circle cx="-145" cy="0" r="4" fill="#10b981" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      AI VISION ACTIVE: IS 2347:2017 DETECTED (99.1%)
    </text>
  </g>
</svg>
