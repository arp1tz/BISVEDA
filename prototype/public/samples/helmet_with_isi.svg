<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Helmet Shell Gradient -->
    <linearGradient id="shellGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="65%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Shell Highlight -->
    <linearGradient id="shellHighlight" x1="30%" y1="0%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#64748b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Visor Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.20" />
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.8" />
    </linearGradient>

    <!-- Visor Reflection Sheen -->
    <linearGradient id="visorSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Gold Accent / Sticker -->
    <linearGradient id="isiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Surface -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Studio Spotlight Reflection Table -->
  <ellipse cx="400" cy="510" rx="280" ry="40" fill="#020617" opacity="0.8" />
  <ellipse cx="400" cy="510" rx="220" ry="25" fill="#000000" opacity="0.6" />

  <!-- Studio Grid Lines (Subtle) -->
  <path d="M50 510 L750 510 M120 480 L680 480 M200 540 L600 540" stroke="#334155" stroke-width="1" opacity="0.3" stroke-dasharray="4,4" />

  <!-- HELMET GROUP -->
  <g transform="translate(10, -10)">
    <!-- Base / Neck Trim Padding (Black Rubber & Mesh) -->
    <path d="M 230 460 C 250 495 510 500 560 460 C 585 435 600 390 600 350 C 590 410 540 470 380 475 C 270 475 235 465 230 460 Z" fill="#090d16" stroke="#1e293b" stroke-width="2" />
    
    <!-- Chin Strap & Quick Release Buckle -->
    <path d="M 330 465 Q 350 535 390 540 Q 425 535 440 468" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round" />
    <path d="M 330 465 Q 350 535 390 540 Q 425 535 440 468" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round" />
    <!-- Red Quick Release Tab -->
    <rect x="375" y="522" width="28" height="14" rx="3" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5" />
    <circle cx="389" cy="529" r="3" fill="#ffffff" />

    <!-- Helmet Outer Aerodynamic Shell -->
    <path d="M 230 430 
             C 180 340 185 210 280 140 
             C 360 80 500 85 580 160 
             C 645 220 660 330 635 410 
             C 615 470 540 470 500 465 
             C 450 460 420 460 380 460 
             C 320 460 255 465 230 430 Z" 
          fill="url(#shellGrad)" 
          stroke="#475569" 
          stroke-width="2.5" />

    <!-- Shell Top Aero Diffuser & Ridge Highlight -->
    <path d="M 290 145 C 370 95 490 100 560 165 C 500 120 380 115 290 145 Z" fill="url(#shellHighlight)" />
    
    <!-- Aero Spoiler Ridge -->
    <path d="M 210 280 C 205 230 235 180 280 150 C 265 180 255 240 260 290 Z" fill="#1e293b" opacity="0.6" />
    <path d="M 570 170 C 620 220 635 280 630 330 C 625 270 600 215 570 170 Z" fill="#0f172a" opacity="0.7" />

    <!-- Top Air Ventilation Scoop -->
    <path d="M 370 105 L 430 105 L 440 120 L 360 120 Z" fill="#020617" stroke="#334155" stroke-width="1.5" />
    <line x1="385" y1="108" x2="385" y2="117" stroke="#64748b" stroke-width="1.5" />
    <line x1="400" y1="108" x2="400" y2="117" stroke="#64748b" stroke-width="1.5" />
    <line x1="415" y1="108" x2="415" y2="117" stroke="#64748b" stroke-width="1.5" />

    <!-- Chin Guard / Face Port Structure -->
    <path d="M 330 455 C 390 455 460 450 515 425 C 480 440 420 445 340 445 Z" fill="#090d16" />

    <!-- Chin Air Vent / Grille -->
    <polygon points="390,405 450,405 440,430 400,430" fill="#090d16" stroke="#475569" stroke-width="1.5" />
    <line x1="420" y1="407" x2="420" y2="428" stroke="#64748b" stroke-width="2" />
    <line x1="405" y1="413" x2="408" y2="426" stroke="#64748b" stroke-width="1.5" />
    <line x1="435" y1="413" x2="432" y2="426" stroke="#64748b" stroke-width="1.5" />

    <!-- VISOR OPENING & EYE PORT CUTOUT -->
    <path d="M 300 215 
             C 380 205 470 210 545 235 
             C 565 242 575 260 565 285 
             C 545 330 520 375 500 395 
             C 450 395 385 390 325 365 
             C 305 355 295 330 295 300 
             C 295 265 298 230 300 215 Z" 
          fill="#020617" />

    <!-- VISOR SHIELD (Polycarbonate with High-Gloss Sheen) -->
    <path d="M 285 205 
             C 375 190 480 195 565 225 
             C 590 235 605 270 595 320 
             C 580 370 550 410 515 425 
             C 455 420 380 410 320 375 
             C 285 355 275 305 278 260 
             C 280 235 282 215 285 205 Z" 
          fill="url(#visorGrad)" 
          stroke="#38bdf8" 
          stroke-width="1.5" />

    <!-- Visor Reflection Curve -->
    <path d="M 310 220 C 390 208 480 218 540 242 C 480 260 380 250 310 280 Z" fill="url(#visorSheen)" />
    <path d="M 300 290 C 340 310 400 325 450 330 C 390 320 340 305 300 290 Z" fill="#ffffff" opacity="0.3" />

    <!-- Visor Pivot Ratchet Mechanism (Left/Right) -->
    <circle cx="282" cy="275" r="16" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <circle cx="282" cy="275" r="10" fill="#0f172a" />
    <circle cx="282" cy="275" r="4" fill="#94a3b8" />

    <circle cx="585" cy="295" r="14" fill="#1e293b" stroke="#64748b" stroke-width="2" opacity="0.8" />
    
    <!-- Aerodynamic Racing Decal Stripes -->
    <path d="M 245 360 C 235 300 250 220 320 160" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <path d="M 255 370 C 248 315 262 235 330 175" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- ============================================== -->
    <!-- OFFICIAL BIS ISI MARK CERTIFICATION STAMP AREA -->
    <!-- Placed on the lower rear shell (statutory position) -->
    <!-- ============================================== -->
    <g id="isiMarkGroup" transform="translate(195, 345)">
      <!-- Sticker White Rectangular Background Plate -->
      <rect x="0" y="0" width="92" height="72" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#glow)" />
      <rect x="2" y="2" width="88" height="68" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />

      <!-- Top Text: Governing Indian Standard -->
      <text x="46" y="11" font-family="'JetBrains Mono', monospace, Arial" font-size="7.5" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">IS 4151:2020</text>
      
      <!-- Horizontal Separator Line -->
      <line x1="8" y1="14" x2="84" y2="14" stroke="#0f172a" stroke-width="0.8" />

      <!-- Official Bureau of Indian Standards (BIS) ISI Emblem Graphic -->
      <g transform="translate(33, 17) scale(0.65)">
        <!-- Outer Frame -->
        <rect x="0" y="0" width="40" height="36" fill="none" stroke="#0f172a" stroke-width="2" rx="2" />
        <!-- Letter 'I' left bar -->
        <line x1="7" y1="6" x2="7" y2="30" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
        <!-- Letter 'S' stylized center curves -->
        <path d="M 27 10 C 27 6 13 6 13 18 C 13 30 27 30 27 24" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
        <!-- Center Horizontal Crossbar -->
        <line x1="7" y1="18" x2="27" y2="18" stroke="#0f172a" stroke-width="2.5" />
      </g>

      <!-- Bottom Separator Line -->
      <line x1="8" y1="44" x2="84" y2="44" stroke="#0f172a" stroke-width="0.8" />

      <!-- CM/L Licence Number (Scheme-I Mandatory Format) -->
      <text x="46" y="52" font-family="'JetBrains Mono', monospace, Arial" font-size="6.5" font-weight="800" fill="#0f172a" text-anchor="middle">CM/L-8400123456</text>
      
      <!-- Statutory Helmet Batch / Size Mark -->
      <text x="46" y="60" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="#475569" text-anchor="middle">TWO-WHEELER HELMET</text>
      <text x="46" y="66" font-family="'JetBrains Mono', monospace" font-size="4.5" font-weight="bold" fill="#0284c7" text-anchor="middle">SIZE: L (590mm) | 1350g</text>
    </g>

    <!-- Inspection Callout Pointer / Target Marker for Demo -->
    <g transform="translate(190, 340)">
      <circle cx="0" cy="0" r="6" fill="#10b981" />
      <circle cx="0" cy="0" r="12" fill="none" stroke="#10b981" stroke-width="2" opacity="0.7">
        <animate attributeName="r" values="6;16;6" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2s" repeatCount="indefinite" />
      </circle>
      <!-- Pointer line to badge -->
      <line x1="0" y1="0" x2="-40" y2="-40" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
      <rect x="-140" y="-62" width="105" height="24" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="-87" y="-46" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ecfdf5" text-anchor="middle">✓ Genuine ISI Mark</text>
    </g>

    <!-- Shell Specification Callout -->
    <g transform="translate(630, 240)">
      <circle cx="0" cy="0" r="5" fill="#38bdf8" />
      <line x1="0" y1="0" x2="30" y2="-20" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
      <rect x="30" y="-35" width="115" height="26" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.2" />
      <text x="87" y="-23" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#e0f2fe" text-anchor="middle">Optical Visor &gt;= 85%</text>
      <text x="87" y="-12" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#7dd3fc" text-anchor="middle">IS 4151 Clause 8.4</text>
    </g>
  </g>

  <!-- Inspection Frame / Camera Bounding HUD (Subtle Tech Aesthetic) -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.65">
    <!-- Top-Left Corner -->
    <path d="M 80 120 L 80 80 L 120 80" />
    <!-- Top-Right Corner -->
    <path d="M 680 80 L 720 80 L 720 120" />
    <!-- Bottom-Left Corner -->
    <path d="M 80 500 L 80 540 L 120 540" />
    <!-- Bottom-Right Corner -->
    <path d="M 680 540 L 720 540 L 720 500" />
  </g>

  <!-- AI HUD Status Overlay Badge Top-Center -->
  <g transform="translate(400, 45)">
    <rect x="-165" y="-15" width="330" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <circle cx="-145" cy="0" r="4" fill="#10b981" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      AI VISION ACTIVE: IS 4151:2020 DETECTED (98.8%)
    </text>
  </g>
</svg>
