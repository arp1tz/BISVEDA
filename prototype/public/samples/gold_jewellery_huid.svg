<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBangleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="75%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <linearGradient id="stampPlacard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2208" />
      <stop offset="100%" stop-color="#140f02" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#0f1117" />
  <ellipse cx="400" cy="510" rx="260" ry="30" fill="#000000" opacity="0.8" />

  <!-- JEWELLERY BANGLE -->
  <g transform="translate(0, -20)">
    <!-- Outer Bangle Ring -->
    <ellipse cx="400" cy="310" rx="240" ry="150" fill="none" stroke="url(#goldBangleGrad)" stroke-width="48" />
    <ellipse cx="400" cy="310" rx="264" ry="174" fill="none" stroke="#ca8a04" stroke-width="2" />
    <ellipse cx="400" cy="310" rx="216" ry="126" fill="none" stroke="#78350f" stroke-width="2" />

    <!-- Filigree / Carving Ornaments on Gold Bangle -->
    <path d="M 180 310 Q 200 290 220 310 Q 240 330 260 310 Q 280 290 300 310" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
    <path d="M 500 310 Q 520 290 540 310 Q 560 330 580 310 Q 600 290 620 310" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round" />

    <!-- Magnified Stamp Inspection Plaque on Lower Inner Surface -->
    <g transform="translate(240, 390)">
      <rect x="0" y="0" width="320" height="100" rx="10" fill="url(#stampPlacard)" stroke="#eab308" stroke-width="2" filter="url(#goldGlow)" />
      
      <!-- 3 Official Hallmarking Stamps: 1. BIS Triangle, 2. Purity 22K916, 3. 6-Digit HUID -->
      <!-- Stamp 1: BIS Triangular Hallmark Logo -->
      <g transform="translate(45, 50)">
        <polygon points="0,-24 24,18 -24,18" fill="none" stroke="#fef08a" stroke-width="3.5" stroke-linejoin="round" />
        <polygon points="0,-14 14,12 -14,12" fill="none" stroke="#fef08a" stroke-width="2" />
        <circle cx="0" cy="3" r="2.5" fill="#fef08a" />
        <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="900" fill="#fef08a" text-anchor="middle">BIS LOGO</text>
      </g>

      <!-- Stamp 2: Purity & Fineness Code (22K916) -->
      <g transform="translate(160, 50)">
        <circle cx="0" cy="-2" r="24" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="2,2" />
        <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#fef08a" text-anchor="middle">22K916</text>
        <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#fef08a" text-anchor="middle">91.6% PURITY</text>
      </g>

      <!-- Stamp 3: 6-Digit Laser Alphanumeric HUID -->
      <g transform="translate(260, 50)">
        <rect x="-35" y="-18" width="70" height="32" rx="4" fill="#000000" stroke="#fef08a" stroke-width="1.5" />
        <text x="0" y="3" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">AZ39K2</text>
        <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#fef08a" text-anchor="middle">6-DIGIT HUID</text>
      </g>
    </g>

    <!-- Inspection Pointer -->
    <g transform="translate(500, 390)">
      <circle cx="0" cy="0" r="6" fill="#10b981" />
      <line x1="0" y1="0" x2="35" y2="-35" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
      <rect x="35" y="-55" width="130" height="24" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="100" y="-39" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ecfdf5" text-anchor="middle">✓ Valid HUID Registered</text>
    </g>
  </g>

  <!-- HUD Overlay -->
  <g transform="translate(400, 45)">
    <rect x="-165" y="-15" width="330" height="30" rx="15" fill="#0f172a" stroke="#eab308" stroke-width="1.5" opacity="0.9" />
    <circle cx="-145" cy="0" r="4" fill="#10b981" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">
      AI VISION ACTIVE: IS 1417:2016 DETECTED (99.4%)
    </text>
  </g>
</svg>
