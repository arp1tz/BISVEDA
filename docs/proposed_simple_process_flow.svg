<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1450" viewBox="0 0 2100 1450" role="img" aria-labelledby="title description">
  <title id="title">BISVEDA simplified query and document-ingestion process flows</title>
  <desc id="description">A presentation-ready, plain-language system diagram. The top row shows a seven-step user-query flow. The lower row shows a five-step document-ingestion flow into one shared knowledge base.</desc>
  <defs>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 42px Arial, sans-serif; fill: #0f2742; }
      .subtitle { font: 400 21px Arial, sans-serif; fill: #4b6278; }
      .section { font: 700 29px Arial, sans-serif; fill: #0f2742; }
      .box-title { font: 700 24px Arial, sans-serif; fill: #102a43; text-anchor: middle; }
      .box-copy { font: 400 18px Arial, sans-serif; fill: #24425e; text-anchor: middle; }
      .box-output { font: 700 17px Arial, sans-serif; fill: #0e7490; text-anchor: middle; }
      .arrow-label { font: 600 16px Arial, sans-serif; fill: #b45309; text-anchor: middle; }
      .note { font: 400 18px Arial, sans-serif; fill: #334e68; }
      .note-strong { font: 700 18px Arial, sans-serif; fill: #0f2742; }
      .tiny { font: 400 15px Arial, sans-serif; fill: #486581; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#c2410c"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect class="canvas" width="2100" height="1450"/>
  <rect x="0" y="0" width="2100" height="112" fill="#dbeafe"/>
  <text x="1050" y="54" class="title" text-anchor="middle">BISVEDA — Simple Process Flow</text>
  <text x="1050" y="88" class="subtitle" text-anchor="middle">One straight path for a user question, plus one separate path for adding trusted documents</text>

  <text x="70" y="162" class="section">A. User question → reliable answer</text>
  <text x="70" y="192" class="subtitle">Use this as the main slide. Each box gives the next team component a clear input and output.</text>

  <!-- Query flow: 7 simple blocks -->
  <g>
    <rect x="55" y="250" width="235" height="350" rx="18" fill="#fff1f2" stroke="#dc2626" stroke-width="3"/>
    <text x="172" y="302" class="box-title">1. User request</text>
    <text x="172" y="347" class="box-copy">
      <tspan x="172" dy="0">Question, voice, photo</tspan>
      <tspan x="172" dy="28">or document</tspan>
      <tspan x="172" dy="40">Example: “Which BIS</tspan>
      <tspan x="172" dy="28">standard applies to</tspan>
      <tspan x="172" dy="28">my helmet?”</tspan>
    </text>
    <rect x="79" y="514" width="186" height="48" rx="12" fill="#fee2e2"/>
    <text x="172" y="545" class="box-output">Input: raw request</text>

    <rect x="350" y="250" width="235" height="350" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="467" y="302" class="box-title">2. Read &amp; prepare</text>
    <text x="467" y="347" class="box-copy">
      <tspan x="467" dy="0">Gateway receives it</tspan>
      <tspan x="467" dy="28">Input handler reads</tspan>
      <tspan x="467" dy="28">voice, image or file</tspan>
      <tspan x="467" dy="40">Language support cleans</tspan>
      <tspan x="467" dy="28">Hindi / Hinglish wording</tspan>
    </text>
    <rect x="374" y="514" width="186" height="48" rx="12" fill="#ffedd5"/>
    <text x="467" y="545" class="box-output">Output: clear query</text>

    <rect x="645" y="250" width="235" height="350" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <text x="762" y="302" class="box-title">3. Understand</text>
    <text x="762" y="347" class="box-copy">
      <tspan x="762" dy="0">Identify the request:</tspan>
      <tspan x="762" dy="28">standard, rule,</tspan>
      <tspan x="762" dy="28">certification, lab,</tspan>
      <tspan x="762" dy="28">verification or document</tspan>
      <tspan x="762" dy="40">Ask only if a key detail</tspan>
      <tspan x="762" dy="28">is missing</tspan>
    </text>
    <rect x="669" y="514" width="186" height="48" rx="12" fill="#fef3c7"/>
    <text x="762" y="545" class="box-output">Output: task + details</text>

    <rect x="940" y="250" width="235" height="350" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="1057" y="302" class="box-title">4. Search knowledge</text>
    <text x="1057" y="347" class="box-copy">
      <tspan x="1057" dy="0">One shared knowledge base</tspan>
      <tspan x="1057" dy="28">Standards • QCO rules</tspan>
      <tspan x="1057" dy="28">Certification routes</tspan>
      <tspan x="1057" dy="28">Labs &amp; centres • FAQs</tspan>
      <tspan x="1057" dy="40">Find the most relevant,</tspan>
      <tspan x="1057" dy="28">current source facts</tspan>
    </text>
    <rect x="964" y="514" width="186" height="48" rx="12" fill="#dbeafe"/>
    <text x="1057" y="545" class="box-output">Output: source evidence</text>

    <rect x="1235" y="250" width="235" height="350" rx="18" fill="#fdf2f8" stroke="#be185d" stroke-width="3"/>
    <text x="1352" y="302" class="box-title">5. Specialist help</text>
    <text x="1352" y="347" class="box-copy">
      <tspan x="1352" dy="0">Only the needed helper runs</tspan>
      <tspan x="1352" dy="28">Match standards • rules</tspan>
      <tspan x="1352" dy="28">Certification • labs</tspan>
      <tspan x="1352" dy="28">Consumer • documents</tspan>
      <tspan x="1352" dy="40">Uses the query + evidence;</tspan>
      <tspan x="1352" dy="28">returns a focused result</tspan>
    </text>
    <rect x="1259" y="514" width="186" height="48" rx="12" fill="#fce7f3"/>
    <text x="1352" y="545" class="box-output">Output: answer sections</text>

    <rect x="1530" y="250" width="235" height="350" rx="18" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="1647" y="302" class="box-title">6. Build the answer</text>
    <text x="1647" y="347" class="box-copy">
      <tspan x="1647" dy="0">Combine the useful results</tspan>
      <tspan x="1647" dy="28">Explain what applies</tspan>
      <tspan x="1647" dy="28">Show source references</tspan>
      <tspan x="1647" dy="28">Give next actions</tspan>
      <tspan x="1647" dy="40">If needed, use a factual</tspan>
      <tspan x="1647" dy="28">template instead of AI prose</tspan>
    </text>
    <rect x="1554" y="514" width="186" height="48" rx="12" fill="#cffafe"/>
    <text x="1647" y="545" class="box-output">Output: draft response</text>

    <rect x="1825" y="250" width="220" height="350" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
    <text x="1935" y="302" class="box-title">7. Check &amp; reply</text>
    <text x="1935" y="347" class="box-copy">
      <tspan x="1935" dy="0">Check sources and</tspan>
      <tspan x="1935" dy="28">important values</tspan>
      <tspan x="1935" dy="28">Remove unsupported claims</tspan>
      <tspan x="1935" dy="40">Return in the user’s</tspan>
      <tspan x="1935" dy="28">language, with citations</tspan>
    </text>
    <rect x="1842" y="514" width="186" height="48" rx="12" fill="#dcfce7"/>
    <text x="1935" y="545" class="box-output">Output: trusted answer</text>

    <line x1="290" y1="425" x2="350" y2="425" stroke="#c2410c" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="585" y1="425" x2="645" y2="425" stroke="#c2410c" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="880" y1="425" x2="940" y2="425" stroke="#c2410c" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="1175" y1="425" x2="1235" y2="425" stroke="#c2410c" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="1470" y1="425" x2="1530" y2="425" stroke="#c2410c" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="1765" y1="425" x2="1825" y2="425" stroke="#c2410c" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="320" y="405" class="arrow-label">raw input</text>
    <text x="615" y="405" class="arrow-label">clear query</text>
    <text x="910" y="405" class="arrow-label">task</text>
    <text x="1205" y="405" class="arrow-label">evidence</text>
    <text x="1500" y="405" class="arrow-label">results</text>
    <text x="1795" y="405" class="arrow-label">draft</text>
  </g>

  <rect x="55" y="635" width="1990" height="96" rx="14" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
  <text x="85" y="675" class="note-strong">Keep the slide simple:</text>
  <text x="85" y="708" class="note">“Speed Gate” is an internal shortcut for exact IDs, FAQs and cached answers; show it only in speaker notes. “Labs” sits inside Specialist Help, not as a compulsory step for every question.</text>

  <text x="70" y="824" class="section">B. Approved document → searchable knowledge</text>
  <text x="70" y="854" class="subtitle">Put this beneath the main flow or on a second slide. It explains how a trusted document becomes usable evidence.</text>

  <!-- Document-ingestion flow: 5 blocks -->
  <g>
    <rect x="120" y="930" width="280" height="235" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="260" y="982" class="box-title">1. Approved document</text>
    <text x="260" y="1028" class="box-copy">
      <tspan x="260" dy="0">BIS / government source</tspan>
      <tspan x="260" dy="28">or approved admin upload</tspan>
      <tspan x="260" dy="40">PDF, notice, scheme,</tspan>
      <tspan x="260" dy="28">lab or QCO record</tspan>
    </text>
    <rect x="153" y="1090" width="214" height="42" rx="10" fill="#ffedd5"/>
    <text x="260" y="1118" class="box-output">Input: source file</text>

    <rect x="510" y="930" width="280" height="235" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <text x="650" y="982" class="box-title">2. Check &amp; identify</text>
    <text x="650" y="1028" class="box-copy">
      <tspan x="650" dy="0">Check the file and source</tspan>
      <tspan x="650" dy="28">Match title, standard no.</tspan>
      <tspan x="650" dy="28">and edition / date</tspan>
      <tspan x="650" dy="40">Reject the wrong or</tspan>
      <tspan x="650" dy="28">unsafe document</tspan>
    </text>
    <rect x="543" y="1090" width="214" height="42" rx="10" fill="#fef3c7"/>
    <text x="650" y="1118" class="box-output">Output: identified file</text>

    <rect x="900" y="930" width="280" height="235" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="1040" y="982" class="box-title">3. Read the content</text>
    <text x="1040" y="1028" class="box-copy">
      <tspan x="1040" dy="0">Extract text and tables</tspan>
      <tspan x="1040" dy="28">Read scanned pages with OCR</tspan>
      <tspan x="1040" dy="40">Keep page and section</tspan>
      <tspan x="1040" dy="28">locations with the text</tspan>
    </text>
    <rect x="933" y="1090" width="214" height="42" rx="10" fill="#dbeafe"/>
    <text x="1040" y="1118" class="box-output">Output: readable content</text>

    <rect x="1290" y="930" width="280" height="235" rx="18" fill="#fdf2f8" stroke="#be185d" stroke-width="3"/>
    <text x="1430" y="982" class="box-title">4. Prepare for search</text>
    <text x="1430" y="1028" class="box-copy">
      <tspan x="1430" dy="0">Split into useful sections</tspan>
      <tspan x="1430" dy="28">such as clauses and tables</tspan>
      <tspan x="1430" dy="40">Attach source, version,</tspan>
      <tspan x="1430" dy="28">date and topic labels</tspan>
    </text>
    <rect x="1323" y="1090" width="214" height="42" rx="10" fill="#fce7f3"/>
    <text x="1430" y="1118" class="box-output">Output: tagged sections</text>

    <rect x="1680" y="930" width="280" height="235" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
    <text x="1820" y="982" class="box-title">5. Store &amp; publish</text>
    <text x="1820" y="1028" class="box-copy">
      <tspan x="1820" dy="0">Store the original file</tspan>
      <tspan x="1820" dy="28">and its tagged sections</tspan>
      <tspan x="1820" dy="40">Publish only approved,</tspan>
      <tspan x="1820" dy="28">current information</tspan>
    </text>
    <rect x="1713" y="1090" width="214" height="42" rx="10" fill="#dcfce7"/>
    <text x="1820" y="1118" class="box-output">Output: knowledge base</text>

    <line x1="400" y1="1048" x2="510" y2="1048" stroke="#0f766e" stroke-width="5" marker-end="url(#blue-arrow)"/>
    <line x1="790" y1="1048" x2="900" y2="1048" stroke="#0f766e" stroke-width="5" marker-end="url(#blue-arrow)"/>
    <line x1="1180" y1="1048" x2="1290" y2="1048" stroke="#0f766e" stroke-width="5" marker-end="url(#blue-arrow)"/>
    <line x1="1570" y1="1048" x2="1680" y2="1048" stroke="#0f766e" stroke-width="5" marker-end="url(#blue-arrow)"/>
  </g>

  <rect x="120" y="1214" width="1840" height="102" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="150" y="1254" class="note-strong">Important boundary:</text>
  <text x="150" y="1287" class="note">A user-uploaded document may follow Steps 2–4 for a private review, but it does not enter the shared Knowledge Base automatically. This protects the quality of the evidence used for later answers.</text>
  <text x="1050" y="1382" class="tiny">Suggested wording is based on the V8 architecture, agent workflow, knowledge-ingestion and implementation-status documents in this workspace.</text>
</svg>
